version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[github-actions]"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[terraform]"
    groups:
      terraform:
        patterns:
          - "*"
